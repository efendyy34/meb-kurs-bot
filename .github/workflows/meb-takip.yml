name: meb-takip

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meb-takip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: MEB sayfasını kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_v2.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "meb-bot"
          git config user.email "meb-bot@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "Durum değişmedi."
            exit 0
          fi
          git commit -m "durum güncellendi"
          # GitHub geçici sunucu hatası (500) verirse tekrar dene
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push başarısız (deneme $i/5), bekleyip tekrar deneniyor..."
            sleep $((i * 8))
            git pull --rebase || true
          done
          echo "Durum 5 denemede de kaydedilemedi."
          exit 1
